<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twixor Mini HUD</title>
  <style>
    :root {
      --bg-base: #080B11;
      --bg-card: #0F1422;
      --bg-card-hover: #162035;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(59, 130, 246, 0.4);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --blue-primary: #2563EB;
      --blue-vibrant: #38BDF8;
      --green-success: #10B981;
      --amber-warning: #F59E0B;
      --red-danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top bar */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .state-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(16, 185, 129, 0.16);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .state-badge.stopped {
      background: rgba(100, 116, 139, 0.2);
      color: #94A3B8;
      border-color: rgba(100, 116, 139, 0.4);
    }

    .state-badge.rate-limited {
      background: rgba(239, 68, 68, 0.25);
      color: var(--red-danger);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .hud-indicator {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--blue-vibrant);
      font-family: monospace;
    }

    /* 3 Metric Cards Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .metric-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .metric-label {
      font-size: 8.5px;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-val {
      font-size: 16px;
      font-weight: 800;
      margin-top: 2px;
    }

    .val-done { color: var(--green-success); }
    .val-collected { color: var(--blue-vibrant); }
    .val-skipped { color: var(--amber-warning); }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--blue-primary), var(--blue-vibrant));
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* Live status text */
    .status-text {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
    }

    /* Action buttons */
    .btn-action {
      width: 100%;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
    }

    .btn-stop {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 10px;
      color: #F87171;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.22);
    }

    .btn-stop:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #FFF;
      border-color: #EF4444;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div>
    <div class="hud-header">
      <div class="badge-wrap">
        <span class="state-badge" id="miniBadge">RUNNING</span>
        <span class="hud-title" id="miniTitle">Twixor Agent</span>
      </div>
      <span class="hud-indicator" id="miniIndicator">Account 0/0</span>
    </div>

    <!-- 3 Metric Cards Grid -->
    <div class="metrics-grid">
      <div class="metric-box">
        <div class="metric-label">DONE</div>
        <div class="metric-val val-done" id="miniDone">0</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">COLLECTED</div>
        <div class="metric-val val-collected" id="miniCollected">0</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">SKIPPED</div>
        <div class="metric-val val-skipped" id="miniSkipped">0</div>
      </div>
    </div>

    <!-- Progress Track -->
    <div class="progress-track">
      <div class="progress-fill" id="miniProgressBar"></div>
    </div>

    <!-- Live Status Text -->
    <div class="status-text" id="miniStatusText">Connecting to workflow...</div>
  </div>

  <!-- Stop Button -->
  <button class="btn-action btn-stop" id="miniStopBtn">
    ⏹️ STOP WORKFLOW
  </button>

  <script src="mini-hud.js"></script>
</body>
</html>
