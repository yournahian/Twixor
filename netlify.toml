[build]
  publish = "website"

[[redirects]]
  from = "http://twixor.bond/*"
  to = "https://twixor.bond/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.twixor.bond/*"
  to = "https://www.twixor.bond/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
